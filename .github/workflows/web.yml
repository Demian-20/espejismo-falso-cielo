# Exporta el juego para web con Godot 4.3 y lo publica en GitHub Pages (issue #14).
#
# - En cada PR hacia dev o main: solo exporta, para comprobar que la build no se rompe.
# - En cada push a main (las entregas): exporta y publica en la rama gh-pages.
# - También se puede correr a mano desde la pestaña Actions (Run workflow).
#
# La build usa la plantilla web sin hilos (thread_support=false), porque GitHub Pages
# no manda los encabezados COOP/COEP y con hilos el juego se queda en pantalla negra.

name: Exportar web

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exportar:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar las plantillas de exportación
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          if [ "$HOME" != "/root" ]; then
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Importar recursos
        run: godot --headless --import || true

      - name: Exportar para web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.pck
          ls -la build/web

      - name: Guardar la build
        uses: actions/upload-artifact@v4
        with:
          name: espejismo-web
          path: build/web

  publicar:
    needs: exportar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # La acción de publicar necesita el repositorio descargado para poder subir a gh-pages.
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Descargar la build
        uses: actions/download-artifact@v4
        with:
          name: espejismo-web
          path: build/web

      - name: Publicar en GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
